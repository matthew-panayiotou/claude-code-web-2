name: Price history

on:
  schedule:
    - cron: "17 1,13 * * *"  # every 12 hours, offset off the hour (01:17 and 13:17 UTC) to avoid GitHub's top-of-hour scheduling congestion
  workflow_dispatch:

permissions:
  contents: write            # needed to commit CSV + MD back to the repo

concurrency:
  group: price-history       # serialize scheduled vs manual runs, avoid push races
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record prices
        run: python3 record_price_history.py

      - name: Commit updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv data/price_history.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update price history ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
