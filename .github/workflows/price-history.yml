name: Price history

on:
  schedule:
    - cron: "17 1,13 * * *"  # every 12 hours, offset off the hour (01:17 and 13:17 UTC) to avoid GitHub's top-of-hour scheduling congestion
  workflow_dispatch:

permissions:
  contents: write            # needed to commit CSV + MD back to the repo

concurrency:
  group: price-history       # serialize scheduled vs manual runs, avoid push races
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record prices
        run: python3 record_price_history.py

      # Must run after record_price_history.py: that script rewrites
      # price_history.md wholesale, and this one appends the Synology section back.
      # always(): a camera-scrape failure must not stop the Synology append.
      - name: Record Synology DVA1622 prices
        if: always()
        env:
          # ScraperAPI key (residential proxies) used for amazon.de; skroutz.cy
          # is fetched for free via r.jina.ai. Without the secret, amazon is
          # skipped and only skroutz is recorded.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python3 record_synology_price_history.py

      # always(): commit whatever either recorder produced, even if one failed,
      # so a transient block on one product never withholds the other's data.
      - name: Commit updated history
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv data/price_history.md data/synology_price_history.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update price history ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
